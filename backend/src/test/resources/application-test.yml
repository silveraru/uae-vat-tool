app:
  security:
    test-keys: true
    issuer: https://test-issuer
    jwk-set-uri: http://unused
  seed:
    enabled: false
  worker:
    enabled: false
  kafka:
    enabled: false
  outbound:
    allow-internal: true
  # A test that needs the platform's backfill starts a stub here. Otherwise nothing answers, as in an outage.
  asp:
    backfill-url: http://localhost:18996
logging:
  level:
    root: WARN
    ae.vattool: INFO
