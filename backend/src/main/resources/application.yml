server:
  port: 18090

spring:
  application:
    name: uae-vat-tool
  datasource:
    url: jdbc:postgresql://localhost:5544/uaevat
    username: vat_app
    password: vat_app
    hikari:
      maximum-pool-size: 20
  flyway:
    user: vat_owner
    password: vat_owner
    url: jdbc:postgresql://localhost:5544/uaevat
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  kafka:
    bootstrap-servers: localhost:19192
    consumer:
      group-id: vat-tool-einvoice-bridge
      auto-offset-reset: earliest
  mail:
    host: localhost
    port: 11025

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 0.1
    export:
      # Point this at an OTLP collector to turn tracing on (NFR-14).
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        vat.einvoice.lag: true

app:
  security:
    issuer: http://localhost:18180/realms/uaevat
    jwk-set-uri: http://localhost:18180/realms/uaevat/protocol/openid-connect/certs
    # Applications whose tokens are accepted. Add a client here for ERP integrations using the REST API.
    allowed-clients: vat-web
  seed:
    enabled: false
  worker:
    enabled: true
  storage:
    endpoint: http://localhost:19100
    region: us-east-1
    access-key: vatminio
    secret-key: vatminio-secret
    bucket: vat-vault
    # GOVERNANCE allows a privileged local reset. Production must use COMPLIANCE.
    lock-mode: GOVERNANCE
  kafka:
    enabled: true
    topic: einvoice.events.v1
  asp:
    backfill-url: http://localhost:18095
  sftp:
    inbox: ../.data/sftp-inbox
  # Who wraps each tenant's data key (NFR-03). "local" is for development and refuses to start under
  # the prod profile. Set kms to "aws" with aws-key-id in a UAE region to use a real key service.
  crypto:
    kms: local
    local-master-key: dGhpcy1pcy1hLWRldmVsb3BtZW50LW9ubHkta2V5ISE=
  # URLs a user gives (webhooks, connectors) may not reach internal addresses unless this is on.
  outbound:
    allow-internal: false
  # Peppol participant lookup for check R08, off until the ASP team confirms the domain to query.
  peppol:
    lookup:
      enabled: false
      sml-domain: edelivery.tech.ec.europa.eu
  # A source of Central Bank rates, as CSV with currency,rate_date,aed_per_unit. Off until one is chosen.
  fx:
    feed:
      url: ""
  fta:
    # Stays off until the FTA publishes a VAT201 API (FIL-04). Do not point this at EmaraTax's web pages.
    direct-submission-enabled: false
