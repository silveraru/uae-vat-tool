app:
  seed:
    enabled: true
    # Builds a year of history for five demo clients on first start. See ae.vattool.demo.
    demo-data: true
  # Lets a webhook or connector reach a stub on this machine. Never set this in production.
  outbound:
    allow-internal: true
  # A stub on this machine standing in for the billing system, the clients' ERPs, a rate feed and the
  # e-invoicing platform's backfill, so those sections work in development. Set the port to 0 to turn it off.
  demo:
    server:
      port: 18097
    dir: ../.data/demo
  fx:
    feed:
      url: http://localhost:18097/fx/rates.csv
  asp:
    backfill-url: http://localhost:18097/asp
# Sends every trace to the local Jaeger in docker-compose, at http://localhost:16686 (NFR-14).
management:
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:14318/v1/traces
