# Local development services. Ports are chosen so they do not collide with other
# projects on this machine (5432, 8080, 8081, 2181, 6333 are taken).
name: uaevat

services:
  postgres:
    image: postgres:16
    # Parallel queries and VACUUM need more than Docker's default 64 MB of shared memory on large tables.
    shm_size: 1g
    environment:
      POSTGRES_DB: uaevat
      POSTGRES_USER: vat_super
      POSTGRES_PASSWORD: vat_super
    ports: ["5544:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vat_super -d uaevat"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["19192:19192"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:19192,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:19192
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6

  # S3-compatible WORM storage. The application only uses the S3 API, so any
  # provider with Object Lock can replace this in a UAE region.
  minio:
    # Pinned by digest: the old minio/minio image is no longer on Docker Hub. Runs as root only so
    # it can write to the named volume in local development.
    image: cgr.dev/chainguard/minio@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vatminio
      MINIO_ROOT_PASSWORD: vatminio-secret
    ports: ["19100:9000", "19101:9001"]
    volumes: [miniodata:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: start-dev --import-realm --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["18180:8080"]
    volumes:
      - ./infra/keycloak/uaevat-realm.json:/opt/keycloak/data/import/uaevat-realm.json:ro

  mailpit:
    image: axllent/mailpit:v1.27.0
    ports: ["18125:8025", "11025:1025"]

  # Receives traces from the backend in development (NFR-14). Production points at its own collector.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "14318:4318"]

  # Clients drop ERP files here. The backend polls the same directory.
  sftp:
    image: atmoz/sftp:alpine
    command: erp:erp-pass:1000
    ports: ["12222:22"]
    volumes:
      - ./.data/sftp-inbox:/home/erp/inbox

volumes:
  pgdata:
  miniodata:
